<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXTRACK - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <span class="logo-icon">🔧</span>
            <span>FIXTRACK</span>
        </div>

        <nav>
            <a href="#">HOME</a>
            <a href="#">REPORT STATUS</a>
            <a href="#">ACCOUNT</a>
            <button class="report-btn">REPORT AN ISSUE</button>
        </nav>
    </header>


    <!-- LOGIN AREA -->
    <main>

        <div class="login-box">

            <h2>Login to your account</h2>

            <form id="loginForm">

                <div class="form-row">
                    <label for="username">User Name</label>
                    <input type="text" id="username" required>
                </div>

                <div class="form-row">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            🔧 FIXTRACK
        </div>

        <div class="footer-text">
            Campus Maintenance Request and<br>
            Reporting System for<br>
            Philippines Christian University-Cavite
        </div>

        <div class="contact">
            CONNECT WITH US<br>
            ● ● ●
        </div>

        <button class="footer-report">
            REPORT AN ISSUE
        </button>

    </footer>


    <script src="script.js"></script>

</body>
</html>
