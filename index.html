<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FixTrack Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <!-- LOGO + FIXTRACK -->
        <div class="header-brand">

            <img src="logo.png" alt="" onerror="this.style.display='none'"
           
               <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
            

            <span>FIXTRACK</span>

        </div>


        <!-- NAVIGATION -->
        <nav>

            <a href="#">HOME</a>

            <a href="#">REPORT STATUS</a>

            <a href="#">ACCOUNT</a>

            <a href="#" class="report-top">
                REPORT AN ISSUE
            </a>

        </nav>

    </header>



    <!-- ================= MAIN ================= -->

    <main>

        <div class="login-card">

            <h1>Login to your account</h1>


            <form id="loginForm">

                <div class="form-row">

                    <label for="username">
                        User Name
                    </label>

                    <input
                        type="text"
                        id="username"
                    >

                </div>


                <div class="form-row">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>Remember me</span>

                </label>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <p id="message"></p>

            </form>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-content">


            <!-- FOOTER LOGO + TEXT -->

            <div class="footer-brand">

                <img
                    src="logo.png"
                    alt="FixTrack Logo"
                >

                <span class="footer-fixtrack">
                    FIXTRACK
                </span>


                <div class="footer-divider"></div>


                <div class="footer-description">

                    Campus Maintenance Request and<br>
                    Management System for<br>
                    Philippine Christian University - Dasmariñas

                </div>

            </div>



            <!-- SOCIAL MEDIA -->

            <div class="social">

                <div class="social-title">
                    CONNECT WITH US!
                </div>

                <div class="social-icons">
                    ◎ &nbsp; f &nbsp; ◉
                </div>

            </div>



            <!-- REPORT BUTTON -->

            <a
                href="#"
                class="report-bottom"
            >
                REPORT AN ISSUE
            </a>

        </div>

    </footer>



    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
